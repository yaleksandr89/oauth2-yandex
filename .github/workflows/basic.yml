name: Baseline CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Resolve and install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Check code style
        run: composer cs:check

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test

  lowest-dependencies:
    name: Lowest dependencies (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Resolve lowest dependencies
        run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable --no-progress

      - name: Run checks
        run: composer check

  coverage:
    name: Coverage (PHP 8.5)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - name: Resolve and install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run coverage
        run: composer coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
